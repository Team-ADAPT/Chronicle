[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle"
version = "0.2.0"
description = "Intelligent Host Behaviour Analysis and Activity Monitoring System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Team ADAPT", email = "adapt@geu.ac.in" }
]
keywords = [
    "security",
    "ebpf",
    "host-monitoring",
    "anomaly-detection",
    "machine-learning",
    "xgboost",
    "isolation-forest",
    "behavioral-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "psutil>=5.9.0",
    "pywebview>=4.4.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1.0",
]
test = [
    "pytest>=8.0.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
chronicle = "app:main"
chronicle-db = "chronicle.db.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "ML/tests"]
pythonpath = ["src", "ML/src", "."]
filterwarnings = [
    "ignore::sklearn.exceptions.InconsistentVersionWarning",
    "ignore::UserWarning:sklearn.utils.validation",
    "ignore::UserWarning:xgboost",
    "ignore:.*If you are loading a serialized model.*:UserWarning",
]
