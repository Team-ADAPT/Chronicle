name: Build and Release Debian Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Black-Box .deb Packages & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools & PyInstaller
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg dpkg-dev binutils
          python -m pip install --upgrade pip
          pip install pyinstaller psutil
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || true
          fi

      - name: Build Black-Box Debian (.deb) Packages
        run: |
          chmod +x packaging/build_deb.sh packaging/make_deb.py
          ./packaging/build_deb.sh

      - name: Security Audit: Verify No Source Code Exposed
        run: |
          ls -lh chronicle_*.deb
          echo "Auditing package contents for exposed source code..."
          if dpkg -c chronicle_1.0.0-1_all.deb | grep '\.py$'; then
            echo "FAILED: Raw Python source code detected in release package!"
            exit 1
          else
            echo "PASSED: Zero .py source files found. Black-box protection verified."
          fi
          dpkg -I chronicle_1.0.0-1_all.deb

      - name: Publish GitHub Release & Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chronicle_1.0.0-1_all.deb
            chronicle_1.0.0-1_arm64.deb
            chronicle_1.0.0-1_amd64.deb
          name: Chronicle ${{ github.ref_name }} — Production Release
          draft: false
          prerelease: false
          generate_release_notes: true
